{% extends 'base.html' %}
{% block title %}Nueva Producción{% endblock %}
{% block page_title %}Registrar producción{% endblock %}

{% block content %}
<div class="card form-card mx-auto">
  <div class="card-header">
    <i class="bi bi-gear-fill me-2 text-success"></i>Nueva entrada de producción
  </div>
  <div class="card-body p-4">
    <form method="POST">
      <div class="row g-3">

        <div class="col-md-4">
          <label class="form-label">Fecha <span class="text-danger">*</span></label>
          <input type="date" name="date" class="form-control"
                 value="{{ today.strftime('%Y-%m-%d') }}" required>
        </div>

        <div class="col-md-5">
          <label class="form-label">Producto <span class="text-danger">*</span></label>
          <select name="product_id" class="form-select" required>
            <option value="">Seleccionar producto...</option>
            {% for p in products %}
            <option value="{{ p.id }}">{{ p.name }} — Stock actual: {{ p.stock }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-3">
          <label class="form-label">Cantidad producida <span class="text-danger">*</span></label>
          <input type="number" name="quantity" class="form-control" min="1"
                 placeholder="Ej: 50" required>
        </div>

        <div class="col-12">
          <label class="form-label">Notas (opcional)</label>
          <textarea name="notes" class="form-control" rows="2"
                    placeholder="Observaciones del lote, turno, etc."></textarea>
        </div>

      </div>

      <hr class="my-4">
      <div class="alert alert-info smaller mb-4">
        <i class="bi bi-info-circle me-2"></i>
        Al guardar, la cantidad indicada se sumará automáticamente al stock del producto.
      </div>

      <div class="d-flex gap-2 justify-content-end">
        <a href="{{ url_for('production.index') }}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-success">
          <i class="bi bi-check-lg me-1"></i>Registrar producción
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
